spring.application.name=matchmaking-backend

# ---------- Database ----------
# ${ENV_VARIABLE:default} - locally the default is used, on AWS you only set DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/sportify}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# creates/updates the tables based on the entities (for development only)
spring.jpa.hibernate.ddl-auto=update
# prints the SQL in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# the connection is open only inside @Transactional, not for the whole HTTP request
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=8090

jwt.secret=${JWT_SECRET:OBgo6E8wJ5zbrxOEqCNNxAMR3KxSBiKBfblkYi6Vq5k=}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}