services:
  postgres:
    image: postgres:17
    container_name: sportify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - sportify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sportify-data: